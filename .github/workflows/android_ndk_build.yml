name: Build Il2CppDumper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
        echo "NDK=$(pwd)/android-ndk-r25b" >> $GITHUB_ENV

    - name: Build
      run: |
        $NDK/ndk-build NDK_PROJECT_PATH=. APP_ABI=all

    - name: Copy output
      run: |
        mkdir -p artifacts
        cp -r libs/* artifacts/

    - name: Zip artifacts
      run: |
        cd artifacts
        zip -r ../Il2CppDumper-libs.zip .
        cd ..

    - name: Determine version
      id: ver
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
        else
          echo "VERSION=v2.0.0-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: Il2CppDumper ${{ env.VERSION }}
        files: Il2CppDumper-libs.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact (backup)
      uses: actions/upload-artifact@v4
      with:
        name: Il2CppDumper-libs
        path: artifacts/
